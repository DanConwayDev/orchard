name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the dev image
        run: |
          podman build -t localhost/orchard-dev-rust \
            -f containers/orchard-dev-rust.containerfile containers/

      # Same shape as scripts/build.sh: the project bind mount keeps
      # :Z, the cargo/rustup volumes stay unlabeled (see AGENTS.md).
      # No cache yet; the toolchain and registry download each run.
      - name: Check and test
        run: |
          podman run --rm \
            -v "$PWD":/work:Z -w /work \
            -v orchard-cargo-home:/root/.cargo \
            -v orchard-rustup-home:/root/.rustup \
            localhost/orchard-dev-rust \
            bash -c '
              if [ ! -x /root/.cargo/bin/cargo ]; then
                curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs |
                  sh -s -- -y --profile minimal --default-toolchain 1.98.1
              fi
              export PATH=/root/.cargo/bin:$PATH
              cargo check --workspace
              cargo test --workspace
            '
