# The Orchard Hello demo, published the M5 way: one command builds the
# app tree into an OCI artifact, pushes it to the publisher's registry,
# and signs the NIP-82 events for the relays.
#
#   ORCHARD_NSEC=<key> orchard-publish demo/hello.publish.toml \
#     --registry localhost:5000/hello

[app]
id = "rocks.orchard.Hello"
name = "Orchard Hello"
summary = "Demo app published through Orchard"
description = "The Orchard demo: a shell script packaged as a flatpak by orchard-publish, pushed to the publisher's registry, and announced as NIP-82 events. The client verifies the pinned digest before install."
categories = ["Utilities"]

[release]
version = "1.4.0"
arch = "linux-x86_64"
runtime = "org.freedesktop.Platform/x86_64/25.08"
notes = "Seam prototype release: exercises the flatpak update path."

[artifact]
tree = "hello"

[publish]
relays = ["ws://127.0.0.1:8008"]
tag = "latest"
# the profile name rides the publisher's kind 0: review rows and the
# "Published by" line show it
author-name = "Orchard Demo"
# the dev NIP-05 fixture: a local server answers for localhost:8443
# and names the demo publisher's key, so the page can show a claim
# that actually checks out. Public publishes get no claim from here.
nip05 = "orchard@localhost:8443"
