# Orchard publishing itself: the same path every publisher uses,
# run on our own artifact. CI runs this on a version tag with
# ORCHARD_NSEC as the only secret; a local run against the demo
# registry is the dry run, with --relays overriding the public
# relays below (you never want a test publish landing on them).
#
#   ORCHARD_NSEC=<key> orchard-publish self/orchard.publish.toml \
#     --registry ghcr.io/letdown2491/orchard

[app]
id = "rocks.orchard.Orchard"
name = "Orchard"
summary = "A permissionless Flatpak store"
description = "Install and update Flatpak apps without gatekeepers. Publishers sign their own releases as Nostr events; reviews are real events too, so trust comes from the people who use the app rather than from a curator. Orchard is published through Orchard, updates included."
categories = ["Utility"]
repository = "https://github.com/Letdown2491/orchard"
icon = "https://raw.githubusercontent.com/Letdown2491/orchard/main/assets/orchard-512.png"

[release]
version = "0.2.0"
arch = "linux-x86_64"
# the full coverage both CI legs build; every leg publishes the same
# listing, and each host picks the artifact built for it
platforms = ["linux-x86_64", "linux-aarch64"]
runtime = "org.freedesktop.Platform/x86_64/25.08"
notes = "Zapstore-published flatpak releases now install and update from Orchard; image updates uninstall first, then install (the running app keeps working, user data is kept); bundle artifacts update in place; the Sources settings section is now Catalog, holding only Opens on; the artifact cache keeps only the newest layout per app. Coming from 0.1.2 or 0.1.4: uninstall and reinstall once, the old client cannot perform this update."

[artifact]
tree = "tree"

[publish]
# relay.orchard.rocks is the required relay (see PUBLISHING.md):
# orchard-publish refuses a manifest publish without it
relays = ["wss://relay.orchard.rocks", "wss://relay.primal.net", "wss://nos.lol"]
tag = "latest"
